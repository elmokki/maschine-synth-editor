; PlatformIO project for ESP32-S3, USB Host side of the Maschine Mk2 controller.
; See docs/PROTOCOL.md for the HID protocol this will eventually drive.
;
; Board: a generic ESP32-S3-WROOM-1 N16R8 board (44-pin, USB Type-C, 16MB
; flash, 8MB octal PSRAM) - "different batch, same board as the EZ1
; project". Matches PlatformIO's esp32-s3-devkitc1-n16r8 definition.

[env:esp32-s3-devkitc1-n16r8]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = espidf
monitor_speed = 115200
build_flags =
    -DCONFIG_USB_OTG_SUPPORTED=1
