; PlatformIO project for ESP32-S3, USB Host side of the Maschine Mk2 controller.
; See docs/PROTOCOL.md for the HID protocol this will eventually drive.
;
; NOTE: `board` below is a guess (generic ESP32-S3-DevKitC-1). Change it to
; match your actual board if different - it affects pin defaults, but the
; USB Host Library code itself uses the native USB OTG peripheral and
; doesn't otherwise depend on the exact board.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_flags =
    -DCONFIG_USB_OTG_SUPPORTED=1
